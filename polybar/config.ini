[colors]
bg = #000000
fg = #FFFFFF
accent = #bd93f9
disabled = #657B83
bg-alt = #282828

[bar/toph]
bottom = true
width = 100%
height = 14pt
radius = 0

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 1
padding-right = 1
module-margin = 1

; On retire le séparateur global "|" pour ne pas surcharger avec les crochets
separator = " "
separator-foreground = ${colors.bg-alt}

font-0 = "MesloLGS Nerd Font Mono:size=10;3"

modules-left = xworkspaces xwindow
modules-right = cpu memory wlan pulseaudio battery date

cursor-click = pointer
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.bg}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.accent}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fg}

[module/cpu]
type = internal/cpu
interval = 2
; Le label "CPU" est en blanc, la valeur est entre crochets violets
format = <label>
label = CPU %{F#bd93f9}[%{F-}%percentage:2%%%{F#bd93f9}]%{F-}

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = RAM %{F#bd93f9}[%{F-}%percentage_used:2%%%{F#bd93f9}]%{F-}

[module/wlan]
type = internal/network
interface-type = wireless
format-connected = <label-connected>
label-connected = WLAN %{F#bd93f9}[%{F-}%essid%%{F#bd93f9}]%{F-}
label-disconnected = %{F#657B83}WLAN [OFF]%{F-}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %{F#bd93f9}[%{F-}%percentage%%%{F#bd93f9}]%{F-}
label-muted = VOL %{F#657B83}[MUT]%{F-}

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = ACAD
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = BAT %{F#bd93f9}[%{F-}+%percentage%%%{F#bd93f9}]%{F-}
label-discharging = BAT %{F#bd93f9}[%{F-}%percentage%%%{F#bd93f9}]%{F-}

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %{F#bd93f9}[%{F-}%date%%{F#bd93f9}]%{F-}