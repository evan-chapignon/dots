# --- MONITORS ---
monitor = DP-1, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1
monitor = , highrr, auto, 1

workspace = 1, monitor:DP-1
workspace = 2, monitor:HDMI-A-1

# --- PROGRAMS ---
$terminal = alacritty
$fileManager = dolphin 
$menu = wofi --show drun -i --config ~/.config/wofi/hypr/config --style ~/.config/wofi/hypr/style.css
$mainMod = SUPER

# --- AUTOSTART ---
exec-once = nm-applet
exec-once = waybar
exec-once = swww-daemon
exec-once = mako
exec-once = hyprctl setcursor Adwaita 24
exec-once = bluetoothctl trust 84:D3:52:C5:B5:2C && bluetoothctl power on && bluetoothctl connect 84:D3:52:C5:B5:2C

# --- ENV & CURSOR ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

cursor {
    no_hardware_cursors = true
}

# --- LOOK & FEEL ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ebdbb2ee) 
    col.inactive_border = rgba(000000dd)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
}

# --- LAYOUT & MISC ---
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- INPUT ---
input {
    kb_layout = fr,fr
    kb_variant = ,dvorak
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    sensitivity = 0.5
    touchpad {
        natural_scroll = true
    }
}

# --- KEYBINDINGS ---
# Apps & System
bind = $mainMod, Q, exec, $terminal 
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, M, togglesplit,
bind = $mainMod, B, exec, firefox
bind = $mainMod, T, exec, emacsclient -c
bind = $mainMod, O, exec, killall -SIGUSR1 waybar
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, comma, exec, hyprctl reload
bind = $mainMod SHIFT, M, exec, hyprquickshot -m region --clipboard-only

# Focus & Move
bind = $mainMod, G, movefocus, l
bind = $mainMod, H, movefocus, r
bind = $mainMod, colon, movefocus, u
bind = $mainMod, L, movefocus, d

bind = $mainMod SHIFT, G, movewindow, l
bind = $mainMod SHIFT, H, movewindow, r
bind = $mainMod SHIFT, colon, movewindow, u
bind = $mainMod SHIFT, L, movewindow, d

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Workspaces (FR Layout bindings)
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# Mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_AUDIO_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_AUDIO_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-sink-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = , Print, exec, playerctl play-pause

# --- WINDOW RULES ---
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = float, class:^(emacs)$
windowrulev2 = size 800x1200, class:^(emacs)$