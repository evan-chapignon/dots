#################################
# Backend
#################################
backend = "glx";
vsync = true;

#################################
# Transparency
#################################
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

#################################
# Window-specific opacity
#################################
# opacity-rule = [
#   "90:class_g = 'Emacs'"
# ];

#################################
# Fading
#################################
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
# Shadows
#################################
shadow = false;

#################################
# Other settings
#################################
corner-radius = 0;
detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;

#################################
#             Blur              #
#################################

# Le dual_kawase est la méthode la plus propre visuellement.
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}

# Important : On exclut le flou pour les fenêtres qui ne sont pas des "vraies" fenêtres
# (évite les bugs sur le fond d'écran ou certains menus)
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       Opacity Rules           #
#################################

# Si tu veux que TOUTES les fenêtres inactives soient floues, 
# la config ci-dessus suffit car elles ont déjà `inactive-opacity = 0.9`.
# Mais si tu veux être sûr que le flou ne s'applique QUE quand c'est transparent :
blur-background-frame = false;