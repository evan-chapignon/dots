[colors.primary]
background = '#000000' # Le noir profond de Modus Vivendi
foreground = '#ffffff' # Texte blanc pour un contraste maximal

[colors.cursor]
text = '#000000'
cursor = '#bd93f9' # Votre couleur de curseur Emacs

[colors.selection]
text = '#ffffff'
background = '#44475a' # Correspond à votre bg-region

[colors.normal]
black =   '#000000'
red =     '#ff5f5f'
green =   '#44bc44'
yellow =  '#d0bc00'
blue =    '#2fafff'
magenta = '#bd93f9' # Accentuation violette
cyan =    '#00d3d0'
white =   '#bfbfbf'

[colors.bright]
black =   '#595959'
red =     '#ff5f5f'
green =   '#44bc44'
yellow =  '#d0bc00'
blue =    '#79a8ff'
magenta = '#e3c7fc' # Version claire de votre accent
cyan =    '#4ae2e2'
white =   '#ffffff'

[font]
size = 8.0

[font.normal]
family = "Iosevka"

[window]
opacity = 1.0

[window.padding]
x = 7
y = 7
